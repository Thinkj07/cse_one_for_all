<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-R">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeApRous Chat</title>
    <style>
        html, body {
            height: 100%; margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .chat-container { display: flex; height: 100vh; width: 100vw; }

        /* ----- Sidebar ----- */
        .sidebar {
            width: 240px; background-color: #3f0e40; color: #d1d2d3;
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            padding: 15px; font-size: 18px; font-weight: bold;
            border-bottom: 1px solid #522653;
        }
        .sidebar-section-title {
            padding: 15px 15px 5px; font-size: 14px;
            font-weight: bold; opacity: 0.7;
        }
        .channel-list, .user-list { flex-shrink: 0; }
        .list-item {
            padding: 8px 15px; cursor: pointer;
            transition: background-color 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .list-item:hover { background-color: #350d36; }
        .list-item.active {
            background-color: #1164A3; color: white; font-weight: bold;
        }
        .connect-button {
            padding: 3px 8px; font-size: 10px; color: white;
            background-color: #007a5a; border: none; border-radius: 4px;
            cursor: pointer; display: none;
        }
        .user-item:hover .connect-button {
            display: inline-block;
        }
        .user-item-name { flex-grow: 1; }
        .user-item-status {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background-color: #38978d; margin-right: 8px;
        }
        
        /* === CSS MỚI: CHẤM ĐỎ THÔNG BÁO === */
        .unread-badge {
            background-color: #fa383e;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 8px;
            text-align: center;
        }
        /* ================================== */


        /* ----- Main Chat ----- */
        .main-chat {
            flex-grow: 1; display: flex; flex-direction: column;
            background-color: #ffffff;
        }
        .chat-header {
            padding: 15px; border-bottom: 1px solid #ddd;
            font-weight: bold; font-size: 18px; background-color: #f9f9f9;
        }
        .messages-window {
            flex-grow: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column;
        }
        .message-input-area {
            display: flex; padding: 20px;
            border-top: 1px solid #ddd; background-color: #f9f9f9;
        }
        #message-input {
            flex-grow: 1; padding: 12px 15px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 15px; margin-right: 10px;
        }
        #send-button {
            padding: 12px 20px; background-color: #007a5a; border: none;
            border-radius: 8px; color: white; font-weight: bold; cursor: pointer;
        }
        
        /* ----- CSS MỚI: Tin nhắn Trái / Phải ----- */
        .message-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }
        .message-sender {
            font-weight: bold; font-size: 14px;
            margin-bottom: 4px; color: #555;
        }
        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        /* Tin nhắn của MÌNH (Gửi đi) */
        .message-group.sent {
            align-self: flex-end; /* Quan trọng: Đẩy sang phải */
        }
        .message-group.sent .message-content {
            background-color: #007a5a; /* Màu đậm */
            color: white;
        }
        .message-group.sent .message-sender {
            display: none; /* Ẩn tên của chính mình */
        }

        /* Tin nhắn NHẬN VỀ */
        .message-group.received {
            align-self: flex-start; /* Quan trọng: Đẩy sang trái */
        }
        .message-group.received .message-content {
            background-color: #f1f1f1; /* Màu nhạt */
            color: #222;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        
        <div class="sidebar">
            <div class="sidebar-header" id="sidebar-header">Welcome!</div>
            
            <div class="sidebar-section-title">Channels</div>
            <div class="channel-list" id="channel-list">
                </div>
            
            <div class="sidebar-section-title">Active Users</div>
            <div class="user-list" id="user-list">
                </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <span id="current-chat-header">#general</span>
            </div>
            
            <div class="messages-window" id="messages-window">
                </div>
            
            <div class="message-input-area">
                <input type="text" id="message-input" placeholder="Message #general...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
